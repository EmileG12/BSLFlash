name: Deploy migrations

# Pushes supabase/migrations/ to the matching hosted Supabase project.
# staging and production are separate GitHub Environments, each with its own
# isolated secrets (Settings -> Environments) -- a job running under one
# environment cannot read the other's secrets. Add a required-reviewer
# protection rule on the "production" environment so this pauses for manual
# approval before it ever touches the live database; staging has no such
# rule and deploys automatically.
#
# Uses --db-url (a direct Postgres connection string), not `supabase link`:
# link authenticates to Supabase's Management API via SUPABASE_ACCESS_TOKEN
# and needs that token scoped with Read on Project Settings/API
# Keys/API Key Secrets, which is unnecessary complexity for a job that only
# ever pushes migrations. --db-url skips the Management API entirely.
#
# SUPABASE_DB_URL must be the *pooler* connection string (Project Settings ->
# Database -> Connection string -> "Connection pooling" tab, Session mode),
# not the direct db.<ref>.supabase.co host -- the direct host only resolves
# over IPv6 on free-tier projects, and GitHub-hosted runners have no IPv6
# connectivity, so it would time out here even though it works locally.

on:
  push:
    branches: [staging, main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to staging
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL"
